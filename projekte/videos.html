<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Film — Werquet</title>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="48x48" href="../img/icons/favicon-48.png">
  <link rel="icon" type="image/png" sizes="96x96" href="../img/icons/favicon-96.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../img/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../img/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --cream: #ffffff; --ink: #1a1a18; --mid: #8a8880; --gap: clamp(2rem, 5vw, 5rem); }
    html { scroll-behavior: smooth; }
    body { background: var(--cream); color: var(--ink); font-family: 'Jost', sans-serif; font-weight: 300; font-size: 15px; letter-spacing: 0.03em; line-height: 1.7; }
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 1rem 0 1rem 1.5rem; height: 6rem; background: var(--cream); border-bottom: 1px solid rgba(26,26,24,0.1); }
    .hamburger { display: none; }
    .nav-name { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: 400; font-style: normal; letter-spacing: 0.15em; text-transform: uppercase; text-decoration: none; color: var(--ink); }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; padding-right: 1.5rem; }
    .nav-links a { text-decoration: none; color: var(--mid); font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; transition: color 0.2s; }
    .nav-links a:hover { color: var(--ink); }
    .project-header { padding: calc(6rem + 1.5rem) 0 1.5rem 1.5rem; }
    .project-header h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(2.5rem, 6vw, 5rem); font-weight: 300; line-height: 1; }
    .video-section { padding: 0 var(--gap) calc(var(--gap) * 2); display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
    .video-item { background: #e0dbd2; overflow: hidden; }
    .video-item video { width: 100%; display: block; aspect-ratio: 9/16; object-fit: cover; }
    .video-item.wide { grid-column: span 2; }
    .video-item.wide video { aspect-ratio: 16/9; }
    .video-label { padding: 0.6rem 0.8rem; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mid); }
    .placeholder { display: flex; align-items: center; justify-content: center; color: var(--mid); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; aspect-ratio: 9/16; }
    .placeholder.wide { aspect-ratio: 16/9; }
    .back-link { display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; color: var(--mid); font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 0 0 1.5rem 1.5rem; transition: color 0.2s; }
    .back-link:hover { color: var(--ink); }
    footer { padding: 1.5rem; font-size: 0.72rem; letter-spacing: 0.08em; color: var(--mid); border-top: 1px solid rgba(26,26,24,0.08); }
    @media (max-width: 960px) {
      .video-section { grid-template-columns: 1fr; }
      .video-item.wide { grid-column: span 1; }
      .video-item.wide video, .placeholder.wide { aspect-ratio: 9/16; }
      nav { height: 6.5rem; padding: 1.2rem 1.5rem; }
      .nav-links { display: none; flex-direction: column; position: fixed; top: 6.5rem; right: 1.5rem; left: auto; width: fit-content; background: var(--cream); padding: 1.2rem 1.8rem; gap: 1.2rem; border: 1px solid rgba(26,26,24,0.1); z-index: 99; }
      .nav-links.open { display: flex; }
      .project-header { padding-right: 1.5rem; }
      .project-desc { padding-right: 1.5rem; }
      .project-grid { padding-right: 1.5rem; }
      .back-link { padding-right: 1.5rem; }
      footer { padding-right: 1.5rem; }
      .nav-name { font-size: 1.1rem; }
      .hamburger { display: flex; flex-direction: column; gap: 5px; cursor: pointer; background: none; border: none; padding: 0; }
      .hamburger span { display: block; width: 22px; height: 1.5px; background: var(--ink); }
    }
    /* ── Sprachumschalter DE / EN ── */
    .lang-switch { display: flex; align-items: center; gap: 0.35rem; font-size: 0.78rem; letter-spacing: 0.12em; color: var(--mid); }
    .lang-switch button { background: none; border: none; padding: 0; font: inherit; letter-spacing: inherit; text-transform: uppercase; color: var(--mid); cursor: pointer; transition: color 0.2s; }
    .lang-switch button:hover, .lang-switch button.active { color: var(--ink); }
    /* Menü bei mittleren Bildschirmbreiten enger, damit es nicht ins Logo läuft */
    @media (min-width: 961px) and (max-width: 1240px) {
      .nav-links { gap: 1.1rem; }
      .nav-links a, .lang-switch { font-size: 0.72rem; letter-spacing: 0.08em; }
    }
    /* Abstand zwischen Text und Fotos (bei allen Alben gleich, enger) */
    .project-desc:last-of-type { padding-bottom: 1rem !important; }
    /* Titel ohne einzelnes Wort/Zahl allein in der letzten Zeile */
    .project-header h1 { text-wrap: balance; }
  </style>
</head>
<body>
  <nav>
    <a href="../index.html" class="nav-name">WERQUET</a>
    <a href="../index.html" style="position:absolute; left:50%; transform:translateX(-50%);"><img src="../img/web/IMG_2625.jpg" alt="Logo" style="height:6rem; width:auto; display:block;"></a>
    <ul class="nav-links" id="nav-links">
      <li class="lang-switch"><button type="button" data-lang="de">DE</button><span aria-hidden="true">/</span><button type="button" data-lang="en">EN</button></li>
      <li><a href="../index.html#work" data-de="Arbeiten">Work</a></li>
      <li><a href="../index.html#video">Visuals</a></li>
      <li><a href="../index.html#service">Service</a></li>
      <li><a href="../index.html#about" data-de="Über mich">About</a></li>
      <li><a href="../index.html#contact" data-de="Kontakt">Contact</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Menue" onclick="document.getElementById('nav-links').classList.toggle('open')">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>
  <div class="project-header"><h1>Film</h1></div>
  <div class="video-section">

    <div class="video-item wide">
      <!-- <video src="../video/web/showreel.mp4" poster="../video/web/showreel.jpg" poster="../img/poster1.jpg" controls muted playsinline></video> -->
      <div class="placeholder wide">Showreel</div>
      <div class="video-label">Showreel</div>
    </div>

    <div class="video-item">
      <!-- <video src="../video/web/lookbook1.mp4" poster="../video/web/lookbook1.jpg" poster="../img/poster2.jpg" controls muted playsinline></video> -->
      <div class="placeholder">Lookbook 1</div>
      <div class="video-label">Lookbook 1</div>
    </div>

    <div class="video-item">
      <!-- <video src="../video/web/lookbook2.mp4" poster="../video/web/lookbook2.jpg" poster="../img/poster3.jpg" controls muted playsinline></video> -->
      <div class="placeholder">Lookbook 2</div>
      <div class="video-label">Lookbook 2</div>
    </div>

  </div>
  <a href="../index.html" class="back-link" data-de="← Zurück zur Übersicht">← Back to overview</a>
  <script>
    document.querySelectorAll('#nav-links a').forEach(function(link) {
      link.addEventListener('click', function() {
        document.getElementById('nav-links').classList.remove('open');
      });
    });
  </script>
  <script src="../lang.js"></script>
</body>
</html>
